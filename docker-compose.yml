services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: civiclens-api

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

    container_name: civiclens-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped